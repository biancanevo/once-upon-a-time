[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "raspi_storyteller"
version = "1.0.0"
description = "AI-powered Storyteller with Audio Integration"
authors = [
    {name = "AI Storyteller Team"}
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
keywords = ["storytelling", "AI", "RFID", "TTS", "Raspberry Pi", "education"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]

dependencies = [
    "Flask>=2.3.0,<3.0.0",
    "flask-cors>=4.0.0",
    "ollama>=0.1.0",
    "edge-tts>=6.1.0",
    "pyttsx3>=2.90",
    "gTTS>=2.3.0",
    "SpeechRecognition>=3.10.0",
    "PyAudio>=0.2.13",
    "pygame>=2.5.0",
    "aiofiles>=23.0.0",
    "aiohttp>=3.9.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "pytest-timeout>=2.2.0",
    "pytest-mock>=3.12.0",
    "responses>=0.24.0",
    "flake8>=6.1.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.5.0",
    "memory-profiler>=0.61.0",
    "psutil>=5.9.0",
    "sphinx>=7.0.0",
    "sphinx-rtd-theme>=1.3.0",
]
raspberry-pi = [
    "RPi.GPIO>=0.7.1",
    "mfrc522>=0.0.7",
    "rpi_ws281x>=5.0.0",
]

[project.scripts]
raspi-storyteller = "raspi_storyteller.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
raspi_storyteller = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --strict-markers"

[tool.black]
line-length = 100
target-version = ['py38']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.venv
  | venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
